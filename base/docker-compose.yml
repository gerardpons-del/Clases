services:
  web1:
    image: nginx:alpine
    container_name: servidor_web_1
    ports:
      - "8080:80"
    volumes:
      - ./web1:/usr/share/nginx/html:ro
    restart: unless-stopped

  web2:
    image: nginx:alpine
    container_name: servidor_web_2
    ports:
      - "8081:80"
    volumes:
      - ./web2:/usr/share/nginx/html:ro
    restart: unless-stopped